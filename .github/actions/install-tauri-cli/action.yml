name: Install pinned tauri-cli (prebuilt)
description: >-
  从 tauri-apps/tauri 的 tauri-cli-v{ver} Release 下载官方预编译 cargo-tauri（Windows x64），
  按 release_assets/toolchain.json 的 tauri_cli / tauri_cli_windows_sha256 校验版本与哈希后加入 PATH。
  替代 cargo install 源码编译（v6.3.0 实测每次 10m19s）。

runs:
  using: composite
  steps:
    - name: 安装 Tauri CLI（精确锁定版本，官方预编译）
      shell: pwsh
      run: |
        # 工具链锁定（WP06）：NSIS 模板/插件随 tauri-cli 版本变化——精确版本与
        # 预编译包哈希都来自 release_assets/toolchain.json，升级走独立可审阅的变更。
        $toolchain = Get-Content (Join-Path $env:GITHUB_WORKSPACE 'release_assets/toolchain.json') -Raw | ConvertFrom-Json
        $version = $toolchain.tauri_cli
        $url = "https://github.com/tauri-apps/tauri/releases/download/tauri-cli-v$version/cargo-tauri-x86_64-pc-windows-msvc.zip"
        $dir = Join-Path $env:RUNNER_TEMP 'tauri-cli'
        $zip = Join-Path $env:RUNNER_TEMP 'cargo-tauri.zip'
        Invoke-WebRequest -Uri $url -OutFile $zip -MaximumRetryCount 3 -RetryIntervalSec 5
        $actual = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
        if ($actual -ne $toolchain.tauri_cli_windows_sha256) {
          throw "tauri-cli 预编译包 sha256 不符：期望 $($toolchain.tauri_cli_windows_sha256)，实际 $actual"
        }
        Expand-Archive -Path $zip -DestinationPath $dir -Force
        $reported = (& (Join-Path $dir 'cargo-tauri.exe') --version).Trim()
        if ($reported -ne "tauri-cli $version") {
          throw "tauri-cli 版本不符：期望 tauri-cli $version，实际 $reported"
        }
        $dir >> $env:GITHUB_PATH
        Write-Host "已安装 $reported（预编译，sha256 已校验）"
