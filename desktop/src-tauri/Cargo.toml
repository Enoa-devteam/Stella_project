[package]
name = "stella-desktop"
version = "6.4.6"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "stella_desktop_lib"
# 只发 Windows 桌面：stella.exe 链接的是 rlib。Tauri 模板默认的 staticlib /
# cdylib 只给 iOS / Android 用，留着会让 release 构建在 fat LTO 下额外产出并
# 优化两份不发布的库（2026-11-22 发布提速；本仓库无 mobile 工程）。
crate-type = ["rlib"]

[[bin]]
name = "Stella"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rand = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3"
sha2 = "0.11"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
